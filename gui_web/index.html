<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RetroMeta Studio</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="studio.css" />
</head>
<body>
  <div id="app">
    <div id="titlebar"></div>
    <div id="tabs-bar"></div>
    <div id="app-body">
      <aside id="nav"></aside>
      <main id="center">
        <div id="collection-header"></div>
        <div id="filter-bar"></div>
        <div id="list-wrap">
          <div id="list-head"></div>
          <div id="list-scroll">
            <div id="list-spacer"></div>
            <div id="list-window"></div>
          </div>
        </div>
      </main>
      <aside id="detail-panel"></aside>
    </div>
    <div id="status-bar"></div>
  </div>

  <div id="modal-root"></div>
  <div id="job-progress"></div>
  <div id="toast"></div>

  <script src="icons.js"></script>
  <script src="system-icons.js"></script>
  <script src="system-icons-raster.js"></script>
  <script src="api-client.js"></script>
  <script src="app.js"></script>
</body>
</html>
