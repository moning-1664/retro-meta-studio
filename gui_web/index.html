<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RetroMeta Studio</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="studio.css" />
  <!-- 테마 토큰과 테마별 변형은 컴포넌트 규칙 뒤에 둔다(theme.css 머리말 참고). -->
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="ui-consistency.css" />
</head>
<body>
  <div id="app">
    <div id="topbar">
      <div id="tabs-bar"></div>
      <div id="topbar-drag" class="pywebview-drag-region"></div>
      <div id="window-controls" class="window-controls"></div>
    </div>
    <div id="app-body">
      <aside id="nav"></aside>
      <main id="center">
        <!-- 윗줄: GameList 상단 Chromium + Detail 상단(미리보기 토글). 이 줄은 Preview를
             꺼도 그대로 남는다 - 접히는 것은 아랫줄의 Detail 내용뿐이다(사용자 요청). -->
        <div id="header-row">
          <div id="collection-header"></div>
          <aside id="detail-top"></aside>
        </div>
        <div id="main-row">
          <!-- Compare 전용: 기준(Source) 쪽 Detail. 평소에는 숨겨져 있다. -->
          <aside id="compare-left"></aside>
          <div id="list-column">
            <!-- Chromium을 펼쳤을 때 나오는 System 카드. **#header-row가 아니라 여기
                 있어야 한다** - 저 줄에 있으면 헤더가 커질 때 줄 전체가 같이 커져서
                 옆의 Detail 패널까지 아래로 밀렸다(사용자 피드백). 여기 있으면 밀리는
                 것은 목록뿐이고, Detail은 제자리를 지킨다. -->
            <div id="collection-expanded"></div>
            <div id="filter-bar"></div>
            <div id="list-wrap">
              <div id="list-head"></div>
              <div id="list-scroll">
                <div id="list-spacer"></div>
                <div id="list-window"></div>
              </div>
            </div>
          </div>
          <aside id="detail-panel"></aside>
        </div>
        <!-- Navigator의 Dashboard를 누르면 위 두 줄 대신 이것이 보인다. -->
        <div id="dashboard-view"></div>
      </main>
    </div>
    <div id="status-bar"><div id="job-progress"></div></div>
  </div>

  <!-- frameless 창은 네이티브 크기 조절 테두리가 없다. 이 손잡이를 끌어서 크기를 바꾼다. -->
  <div id="resize-grip" title="끌어서 창 크기 조절"></div>

  <div id="modal-root"></div>
  <div id="toast"></div>

  <script src="version.js"></script>
  <script src="i18n-data.js"></script>
  <script src="i18n.js"></script>
  <script src="i18n-extra.js"></script>
  <script src="i18n-messages.js"></script>
  <script src="icons.js"></script>
  <script src="system-icons.js"></script>
  <script src="system-icons-pack.js"></script>
  <script src="title-affix.js"></script>
  <script src="api-client.js"></script>
  <script src="settings.js"></script>
  <script src="dashboard.js"></script>
  <script src="candidate-ui.js"></script>
  <script src="shortcut-help.js"></script>
  <script src="scraper-ui.js"></script>
  <script src="transfer-ui.js"></script>
  <script src="archive-settings-ui.js"></script>
  <script src="collection-setup-ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
